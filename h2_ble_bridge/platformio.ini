; Seeed XIAO ESP32-C3 — SwitchBot BLE + ESP-NOW bridge → UART → Tab5 (M5-Bus G6/G7)
;
; Build z kořene (Project Tasks):  pio run -e bridge
; Build z této složky:             pio run
; USB upload:                      pio run -t upload
; OTA upload:                      pio run -e bridge-ota -t upload
;
; UART: Xiao D6/TX=21 → Tab5 G7, D7/RX=20 ← Tab5 G6
; ---------------------------------------------------------------------------

[platformio]
default_envs = bridge

[env:bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

build_src_filter =
  -<*>
  +<src/*>

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBRIDGE_TX_PIN=21
  -DBRIDGE_RX_PIN=20
  -DUART_BAUD=115200
  -DSTATUS_LED_PIN=-1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -I$PROJECT_DIR/../include

lib_deps =
  h2zero/NimBLE-Arduino@^2.2.3

lib_ldf_mode = deep

[env:bridge-ota]
extends = env:bridge
upload_protocol = espota
upload_port = 192.168.50.16
board_upload.require_upload_port = false
upload_flags =
  --port=3232
  --timeout=120
; Skript je v kořeni projektu (../scripts) — při buildu z této složky:
extra_scripts =
  pre:../scripts/force_ota_upload_port.py

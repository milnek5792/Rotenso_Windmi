<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="description" content="Dálkové ovládání LG Therma — prototyp PWA">
  <title>LG Therma</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-512.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand" aria-label="LG Therma">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="10" width="22" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="16" cy="18" r="5.5" stroke="#0a84ff" stroke-width="1.5"/>
          <path d="M16 12.5v11M10.5 18h11" stroke="#0a84ff" stroke-width="1" opacity="0.45"/>
          <path d="M9 7h14" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round"/>
          <path d="M11 7v3M21 7v3" stroke="#ff9f0a" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-text">LG Therma</span>
      </div>
      <div class="topbar-status">
        <span id="sig-mqtt" class="sig sig-off" role="status" aria-label="MQTT: odpojeno">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 18a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M4.5 14.5a9 9 0 0 1 15 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M2 11a13 13 0 0 1 20 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="12" cy="18" r="1.6" fill="currentColor"/>
          </svg>
        </span>
        <span id="sig-lin" class="sig sig-label sig-off" role="status" aria-label="LIN: odpojeno">LIN</span>
      </div>
    </header>

    <div id="fault-banner" class="fault-banner hidden" role="alert">
      <strong>Poruchové hlášení</strong>
      <span id="fault-text"></span>
    </div>

    <!-- DOMŮ -->
    <main id="view-home" class="view view-active">
      <section class="setpoint-panel">
        <h1 id="sp-title" class="sp-title sp-room">Nastavení pokojové teploty</h1>
        <div class="sp-row">
          <button type="button" class="btn-round" id="btn-minus" aria-label="Snížit">−</button>
          <div class="sp-value-wrap">
            <div class="sp-value-line">
              <span id="sp-value" class="sp-value">—</span>
              <span class="sp-unit">°C</span>
            </div>
            <p id="water-sp" class="water-sp hidden">Voda SP 38 °C</p>
          </div>
          <button type="button" class="btn-round" id="btn-plus" aria-label="Zvýšit">+</button>
        </div>
      </section>

      <section class="temp-grid">
        <div class="temp-card">
          <div class="temp-label">Vnitřní teplota</div>
          <div class="temp-value" id="temp-room">—</div>
        </div>
        <div class="temp-card">
          <div class="temp-label">Venkovní teplota</div>
          <div class="temp-value temp-outdoor" id="temp-outdoor">—</div>
        </div>
        <div class="temp-card">
          <div class="temp-label">Teplota na vstupu</div>
          <div class="temp-value" id="temp-inlet">—</div>
        </div>
        <div class="temp-card">
          <div class="temp-label">Teplota na výstupu</div>
          <div class="temp-value temp-outlet" id="temp-outlet">—</div>
        </div>
      </section>

      <section class="status-grid" aria-label="Stav zařízení">
        <div class="stat stat-warn" id="stat-power" title="Zapnuto" aria-label="Zapnuto: vypnuto">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M8.5 4.5a7 7 0 1 0 7 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="stat" id="stat-pump" title="Čerpadlo" aria-label="Čerpadlo: vypnuto">
          <span class="stat-glyph" aria-hidden="true">🔄</span>
        </div>
        <div class="stat" id="stat-compressor" title="Kompresor" aria-label="Kompresor: vypnuto">
          <span class="stat-glyph" aria-hidden="true">🌀</span>
        </div>
        <div class="stat stat-warn" id="stat-defrost" title="Odmrazování" aria-label="Odmrazování: vypnuto">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8.5 4.5v5.2M8.5 4.5l1.8 1.6M8.5 9.7l1.8-1.6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <path d="M5.8 7.1h5.4M5.8 7.1l1.9 1.1M10.7 7.1l-1.9 1.1" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <path d="M15.8 9c0 2.1-3.3 4.3-3.3 6.8a3.3 3.3 0 0 0 6.6 0C19.1 13.3 15.8 11.1 15.8 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="stat stat-warn" id="stat-elec" title="El. topení" aria-label="El. topení: vypnuto">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M13 2L6 14h6l-1 8 7-12h-6l1-8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
      </section>

      <section class="power-row">
        <button type="button" class="btn-power btn-start" id="btn-start">START</button>
        <button type="button" class="btn-power btn-stop" id="btn-stop">STOP</button>
      </section>
    </main>

    <!-- NASTAVENÍ -->
    <main id="view-settings" class="view" hidden>
      <h2 class="view-heading">Připojení MQTT</h2>
      <p class="view-lead">
        PWA slouží jen k ovládání. Časový plán a regulátor PID zůstávají na Tab5.
      </p>

      <form id="settings-form" class="settings-form" autocomplete="off">
        <label class="field">
          <span>Broker (WSS)</span>
          <input type="url" id="cfg-host" placeholder="wss://broker.example.com:8084/mqtt">
        </label>
        <label class="field">
          <span>Uživatel</span>
          <input type="text" id="cfg-user" autocomplete="username">
        </label>
        <label class="field">
          <span>Heslo</span>
          <input type="password" id="cfg-pass" autocomplete="current-password">
        </label>
        <label class="field">
          <span>Topic prefix</span>
          <input type="text" id="cfg-prefix" value="lgtherma">
        </label>
        <div class="settings-actions">
          <button type="button" class="btn-primary" id="btn-connect">Připojit</button>
          <button type="button" class="btn-secondary" id="btn-disconnect" disabled>Odpojit</button>
        </div>
        <p id="cfg-status" class="cfg-status" role="status"></p>
      </form>
    </main>

    <nav class="bottom-nav" aria-label="Hlavní navigace">
      <button type="button" class="nav-btn nav-active" data-view="home">
        <span class="nav-icon">⌂</span>
        <span>Domů</span>
      </button>
      <button type="button" class="nav-btn" data-view="settings">
        <span class="nav-icon">⚙</span>
        <span>Nastavení</span>
      </button>
    </nav>
  </div>

  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script type="module" src="js/app.js?v=22"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121214">
  <title>Windmi — reset service worker</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #121214;
      color: #e0e0e6;
      font-family: system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
    button, a.btn {
      display: inline-block;
      margin: 8px 6px;
      padding: 12px 18px;
      border-radius: 10px;
      border: 0;
      background: #0a84ff;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    a.btn.secondary { background: #2c2c2e; }
    #log {
      margin-top: 20px;
      text-align: left;
      max-width: 420px;
      font-size: 0.85rem;
      color: #8e8e93;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div>
    <h1>Reset service worker</h1>
    <p>Smaže SW a cache webu Windmi v tomto prohlížeči — stejně jako minule, když to pomohlo.</p>
    <button type="button" id="btn-reset">Vymazat SW + cache</button>
    <a class="btn secondary" href="./">Otevřít Windmi</a>
    <div id="log"></div>
  </div>
  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
    }
    async function wipe() {
      logEl.textContent = '';
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          if (!regs.length) {
            log('Žádný service worker');
          }
          for (const reg of regs) {
            const ok = await reg.unregister();
            log('SW unregister: ' + (reg.scope || '?') + ' → ' + ok);
          }
        }
        if (window.caches) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
            log('cache delete: ' + key);
          }
        }
        try {
          localStorage.clear();
          sessionStorage.clear();
          log('local/session storage cleared');
        } catch (e) {
          log('storage: ' + e);
        }
        log('Hotovo. Zavři Chrome úplně (odebrat z recent) a otevři Windmi znovu.');
      } catch (e) {
        log('Chyba: ' + e);
      }
    }
    document.getElementById('btn-reset').addEventListener('click', wipe);
    if (new URLSearchParams(location.search).has('auto')) {
      wipe();
    }
  </script>
</body>
</html>

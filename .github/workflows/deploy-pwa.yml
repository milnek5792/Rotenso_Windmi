# Nasadí docs/pwa na GitHub Pages pod /w2/ (nová instalční identita).
name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - "docs/pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site root
        run: |
          mkdir -p _site/w2
          cp -a docs/pwa/. _site/w2/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="cs">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./w2/">
            <title>Windmi</title>
            <link rel="canonical" href="./w2/">
          </head>
          <body>
            <p><a href="./w2/">Otevřít Windmi PWA</a></p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

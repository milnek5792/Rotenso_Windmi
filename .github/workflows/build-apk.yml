# Sestaví nativní Kotlin/Compose APK (MQTT přes HiveMQ).
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-app/build.log
          if-no-files-found: ignore

      - name: Summarize Gradle errors
        if: failure()
        run: |
          {
            echo "## Gradle errors"
            echo '```'
            grep -E "e: |error:|FAILED|What went wrong|Execution failed|\.kt:[0-9]+" android-app/build.log | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface first compile errors (readable without private logs).
          grep -E "^e: |What went wrong|Execution failed|> |FAILED|Duplicate|META-INF" android-app/build.log | head -n 50 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Rename APK
        run: |
          set -euo pipefail
          SRC="android-app/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist
          cp "$SRC" "dist/WindmiCtrl-${{ github.sha }}.apk"
          cp "$SRC" "dist/WindmiCtrl-latest.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindmiCtrl-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WindmiCtrl-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

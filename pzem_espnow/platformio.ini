; Waveshare ESP32-S3-Relay-1CH — PZEM-004T TTL → ESP-NOW + OTA
; Build:  pio run -d pzem_espnow
; Upload USB:  pio run -d pzem_espnow -t upload
; Upload OTA:  pio run -d pzem_espnow -e esp32-s3-relay-pzem-ota -t upload
; Hostname: windmi-pzem — STA Wi‑Fi vždy (include/wifi_config.h), kanál = AP
; Wi‑Fi: include/wifi_config.h — DHCP rezervace → upload_port

[env:esp32-s3-relay-pzem]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DPZEM_RX_PIN=1
  -DPZEM_TX_PIN=2
  -I../include

build_src_filter = +<*>

[env:esp32-s3-relay-pzem-ota]
extends = env:esp32-s3-relay-pzem
upload_protocol = espota
upload_port = 192.168.50.98
upload_flags =
  --port=3232
  --timeout=120
board_upload.require_upload_port = false
extra_scripts =
  pre:../scripts/force_ota_upload_port.py

# Nasadí docs/pwa na GitHub Pages (HTTPS) pro instalaci PWA na mobil.
name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - "docs/pwa/**"
      - ".github/workflows/pages-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pwa
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pwa

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

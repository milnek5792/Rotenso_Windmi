# Nasadí docs/pwa na GitHub Pages (kořen = PWA, /w2/ redirect, /x/ reset).
name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - "docs/pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site root
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a docs/pwa/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/w2/index.html
          test -f _site/x/index.html
          test -f _site/js/mqtt.min.js
          find _site -maxdepth 2 -type f | sort | head -n 40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

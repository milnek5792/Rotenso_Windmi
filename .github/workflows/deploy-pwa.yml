# Nasadí docs/pwa na GitHub Pages pod /w2/ (nová instalční identita).
name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - "docs/pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site root
        run: |
          mkdir -p _site/w2
          cp -a docs/pwa/. _site/w2/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="cs">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Windmi</title>
            <meta name="theme-color" content="#121214">
            <style>
              body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#121214;color:#e0e0e6;font-family:system-ui,sans-serif;padding:24px;text-align:center}
              a{color:#0a84ff}
              button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#0a84ff;color:#fff;font-weight:700}
              #log{margin-top:16px;color:#8e8e93;font-size:.85rem;white-space:pre-wrap;text-align:left;max-width:420px}
            </style>
          </head>
          <body>
            <div>
              <h1>Windmi</h1>
              <p>Nejdřív vymaž starou instalaci prohlížeče, pak otevři aplikaci.</p>
              <button type="button" id="go">Vymazat cache a otevřít PWA</button>
              <p><a href="./w2/reset.html">Jen reset stránka</a></p>
              <div id="log"></div>
            </div>
            <script>
              document.getElementById('go').onclick = async () => {
                const log = document.getElementById('log');
                const lines = [];
                const say = (m) => { lines.push(m); log.textContent = lines.join('\n'); };
                try {
                  if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    for (const r of regs) {
                      await r.unregister();
                      say('unregister ' + r.scope);
                    }
                  }
                  if (window.caches) {
                    for (const k of await caches.keys()) {
                      await caches.delete(k);
                      say('delete cache ' + k);
                    }
                  }
                } catch (e) {
                  say(String(e));
                }
                location.href = './w2/';
              };
            </script>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
